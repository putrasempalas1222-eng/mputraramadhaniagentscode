<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>mputraramadhani agents — Remote | Ramadhani AI Labs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231e3a5f'/%3E%3Ctext x='16' y='21' font-family='Georgia,serif' font-size='14' font-weight='700' fill='%23f7f5f0' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="remote.css" />
</head>
<body>
  <div id="app">

    <!-- Header situs -->
    <header class="remote-top">
      <div class="remote-top-inner">
        <a class="remote-brand" href="index.html">
          <img class="remote-brand-icon" src="logo.png" alt="logo" />
          <span class="remote-brand-name">mputraramadhani agents <em>Remote</em></span>
        </a>
        <div class="remote-actions">
          <button id="themeToggle" type="button" class="theme-btn" aria-label="Toggle theme" title="Ganti tema">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a class="remote-back-link" href="index.html">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            <span>Unduhan</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Pairing lewat kode rahasia dari Pengaturan → Akses Remote -->
    <section id="view-pair" class="view glass">
      <div class="brand">
        <img class="brand-logo-img" src="logo.png" alt="mputraramadhani agents" />
        <h2>Hubungkan Remote</h2>
      </div>
      <p class="pair-hint">
        Buka VS Code &rarr; <strong>Pengaturan</strong> &rarr; <strong>Akses Remote</strong>
        &rarr; <strong>Buat Kode Baru</strong>.
      </p>
      <div class="code-box">
        <input id="code-input" maxlength="6" autocomplete="off" spellcheck="false"
                placeholder="KODE" aria-label="Kode rahasia" autofocus />
      </div>
      <button id="pair-btn" type="button" class="primary block-btn">Hubungkan Sekarang</button>
      <p id="pair-error" class="error hidden"></p>
      <div class="pair-info">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Kode rahasia adalah bukti akses instan. Sesi dikendalikan dari VS Code.</span>
      </div>
      <button id="pair-logout" type="button" class="link hidden">Keluar</button>
    </section>

    <!-- Chat remote — cermin percakapan di extension -->
    <section id="view-chat" class="view hidden">
      <header id="chat-header">
        <div class="head-left">
          <div id="chat-status" class="status offline">Extension: menunggu…</div>
          <div id="chat-title" class="session-badge hidden"></div>
          <div id="chat-account" class="muted small-text"></div>
        </div>
        <div class="head-right">
          <div class="model-picker">
            <label for="chat-model-select" class="muted small-text">Model</label>
            <select id="chat-model-select" class="secondary small" disabled>
              <option value="">Otomatis (default)</option>
            </select>
          </div>
          <button id="chat-logout" type="button" class="secondary small">Keluar Remote</button>
        </div>
      </header>
      <main id="messages" aria-live="polite"></main>
      <p id="chat-error" class="error hidden"></p>
      <footer id="composer-area">
        <div id="composer-card">
          <div id="attachment-preview-bar" class="attachment-preview-bar hidden"></div>
          <div class="composer-inner">
            <input type="file" id="file-input" accept="image/*" multiple hidden />
            <button id="attach-btn" type="button" class="composer-action-btn" title="Lampirkan Gambar (paste / drag & drop foto)" aria-label="Lampirkan Gambar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
            </button>
            <textarea id="compose" rows="1" maxlength="20000"placeholder="Ketik pesan "></textarea>
            <button id="send-btn" type="button" class="composer-send-btn" title="Kirim Pesan" aria-label="Kirim">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
        <div class="composer-footer-hint">
          <span>Shift + Enter untuk baris baru · Paste atau Drag & drop foto</span>
        </div>
      </footer>
    </section>

    <!-- Lightbox preview foto -->
    <div id="image-lightbox" class="lightbox-modal hidden" role="dialog" aria-modal="true">
      <div class="lightbox-content">
        <button id="lightbox-close" type="button" class="lightbox-close-btn" aria-label="Tutup">✕</button>
        <img id="lightbox-img" alt="Preview Foto Full" />
      </div>
    </div>

    <!-- Sesi diakhiri dari pihak extension -->
    <section id="view-kicked" class="view glass hidden">
      <h2>Sesi remote diakhiri</h2>
      <p id="kicked-reason" class="muted"></p>
      <button id="kicked-back" type="button" class="primary">Hubungkan Ulang</button>
    </section>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="remote.js"></script>
</body>
</html>
